# 研究设计模板：当前没有实现读取此文件的训练程序。
# 不能直接传给原始 ViewCrafter / Ultralytics 命令执行。
status: proposed_not_implemented
date: '2026-10-15'
resource_constraints:
  gpu: RTX_4090
  vram_gb: 24
  new_calibrated_real_multiview_capture: false
  run_large_models_sequentially: true

experiment:
  title: learning_to_generate_useful_uav_views
  split_seed: 2027
  training_seeds: [2027, 2028, 2029]
  generation_seed_pool: [123, 124, 125]
  seed_policy: map_parent_scene_and_candidate_to_seed_before_selection
  final_test_labels_access: scoring_only
  final_test_used_for_selection_or_tuning: false
  preregistration_required_before_final_test: true

data:
  availability_audited_this_turn: false
  geometry_validation: MatrixCity
  real_detection: VisDrone2019_DET
  real_grounded_text: VisDrone_derived_human_reviewed
  external_detection_candidate: UAVDT
  preserve_official_split_fields: true
  strict_scene_isolation_reported_separately: true
  group_by: [location, sequence, near_duplicate_components, overlapping_views]
  descendants_inherit_parent_split: true
  meta_learning_roles: [real_core, meta_proposal, meta_real]
  meta_roles_scene_isolated: true
  obstacle_evaluation_requires_complete_annotation: true

generation:
  backbone: ViewCrafter_16
  weights_status: not_downloaded_or_tested_in_this_task
  frozen: true
  frame_height: 576
  frame_width: 1024
  frames: 16
  retained_frame_indices_zero_based: [3, 7, 11, 15]
  ddim_steps: 50
  guidance_scale_initial: 7.5
  ddim_eta_initial: 0.0
  perframe_ae: true
  batch_size: 1
  pose_convention: OpenCV_right_handed_Twc
  real_unknown_pose_scale_status: relative_only
  true_target_rgb_available_at_generation: false
  true_target_depth_available_at_generation: false
  checkpoint_revision: null
  checkpoint_sha256: null
  upstream_commit: null

candidates:
  delta_theta_deg: [-10, 0, 10]
  delta_phi_deg: [-15, 0, 15]
  delta_radius_relative: [-0.1, 0, 0.1]
  remove_zero_motion_endpoint: true
  candidate_endpoints_per_scene: 26
  save_actual_camera_matrices: true
  geometry_feasibility_thresholds_status: calibrate_on_development_only
  baseline_static_coverage_initial: 0.60
  baseline_short_side_pixels_initial: [12, 96]

utility:
  input_availability: before_diffusion_generation
  teacher_signal: loss_decrease_on_scene_disjoint_meta_real
  gradient_approximation: detection_head_and_small_grounding_head
  validate_approximation_with_short_updates: true
  short_update_steps_range: [10, 50]
  predictor_initial_options: [regularized_mlp, tree_regressor]
  uncertainty: scene_bootstrap_model_disagreement
  uncertainty_is_exact_posterior: false
  conservative_score: max_zero_mean_minus_disagreement_minus_instance_error_risk
  selection_objective: fixed_nonnegative_facility_location_and_saturating_coverage
  generator_error_labels: human_reviewed_trial_generations
  generated_pool_labels_available_for_formal_candidate_ranking: false
  count_trial_generation_and_label_cost: true

budgets:
  pilot:
    reference_scenes: 10
    trajectories_per_scene: 2
  utility_calibration:
    reference_scene_target_range: [40, 64]
    trajectories_per_scene: 4
    retained_frames_per_trajectory: 4
  formal_per_strategy:
    max_reference_scenes: 100
    max_trajectories_per_scene: 3
    max_trajectories: 300
    max_raw_frames: 4800
    max_retained_frames: 1200
  real_grounded_text_annotation_initial_range: [600, 1000]
  actual_gpu_hours_measured: null
  actual_annotation_hours_measured: null
  failures_consume_budget: true
  unlimited_resampling: false
  shared_calibration_pool_policy: equal_access_or_exclude_from_all_final_training

annotation:
  reannotate_generated_visible_objects: true
  source_boxes_direct_inheritance: false
  projected_boxes_are_only_initial_proposals: true
  captions_grounded_to_object_ids: true
  unidentifiable_objects: ignore_or_unknown
  unmatched_parent_instances: identity_unknown_not_automatic_disappearance
  distinguish_generated_new_instances_from_preserved_instances: true
  generated_risk_level_training_labels: false

downstream:
  primary_detector: YOLOv8s
  second_detector_candidate: RT_DETR_R18
  detector_input_size_initial: 960
  physical_batch_size_initial: 4
  effective_batch_size: determine_then_freeze
  precision: mixed_after_compatibility_check
  fixed_total_optimization_steps_across_groups: true
  total_optimization_steps: null
  synthetic_sample_fraction_definition: fraction_of_total_sampled_training_images
  synthetic_sample_fraction_initial: 0.3333333333
  synthetic_to_real_ratio_initial: 0.5
  synthetic_to_real_ratio_sensitivity: [0.0, 0.25, 0.5, 1.0]
  grounding: frozen_image_text_encoders_with_small_trainable_projection_head
  risk_auxiliary: fixed_detector_region_rule_pipeline_on_real_data

evaluation:
  primary: [real_detection_AP, real_APsmall, end_to_end_grounding_AccIoU50]
  secondary: [instance_preservation, assertion_precision_coverage, utility_ranking, cost_per_valid_sample]
  geometry: [heldout_static_LPIPS, static_landmark_reprojection_error, valid_matching_rate]
  report_official_10class_and_inspection_mapping_separately: true
  report_extra_supervision_for_low_label_experiments: true
  statistical_unit: scene_group
  bootstrap_repetitions_initial: 1000
  bootstrap_seed: 2030
  confidence_level: 0.95
  report_per_seed_results: true
  cost_axes: [gpu_hours_including_calibration, human_annotation_hours, generator_calls, optimizer_steps]

implementation_lock:
  python_lock: null
  container_digest: null
  dataset_manifest_sha256: null
  annotation_version: null
  software_versions_status: determine_by_pilot_then_freeze
